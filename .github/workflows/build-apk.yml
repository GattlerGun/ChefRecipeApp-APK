name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fast Git Checkout (No Node.js 20)
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK with Native Gradle
        run: |
          gradle assembleDebug --no-daemon --build-cache

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChefRecipeApp.apk
          gh release delete latest-apk --yes || true
          git tag -f latest-apk
          git push -f origin latest-apk
          gh release create latest-apk ChefRecipeApp.apk --title "Шеф-Повар APK (Свежая сборка)" --notes "Прямое скачивание файла ChefRecipeApp.apk без ZIP-архива"

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: ChefRecipeApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
