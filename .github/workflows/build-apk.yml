name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Lock Persistent Signing Key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.android
          git fetch origin main
          if git cat-file -e origin/main:app/fixed-debug.keystore 2>/dev/null; then
            git show origin/main:app/fixed-debug.keystore > app/fixed-debug.keystore
          fi
          if [ ! -f app/fixed-debug.keystore ]; then
            keytool -genkeypair -v -keystore app/fixed-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/fixed-debug.keystore
            git commit -m "chore: save persistent keystore [skip ci]" || true
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 3
            done
          fi
          cp -f app/fixed-debug.keystore ~/.android/debug.keystore

      - name: Install Gradle and Build APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q -o gradle.zip -d /tmp
          chmod +x /tmp/gradle-8.7/bin/gradle
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChefRecipeApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChefRecipeApp.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk ChefRecipeApp.apk --target main --title "Шеф-Повар APK" --notes "Свежая сборка ChefRecipeApp.apk с постоянной подписью" || true
