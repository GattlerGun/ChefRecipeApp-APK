name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fast Git Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin main
          git checkout -B main origin/main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Persistent Signing Keystore
        run: |
          git pull --rebase origin main || true
          if [ ! -f app/fixed-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/fixed-debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git add app/fixed-debug.keystore
              git commit -m "chore: save persistent debug.keystore [skip ci]" || true
              git push origin HEAD:main && break
              sleep 2
            done
          fi
          mkdir -p ~/.android
          cp -f app/fixed-debug.keystore ~/.android/debug.keystore

      - name: Install Gradle 8.7, Build and Force-Sign APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon
          APKSIGNER=$(find$ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks app/fixed-debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChefRecipeApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChefRecipeApp.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk ChefRecipeApp.apk --target main --title "Шеф-Повар APK (Свежая сборка)" --notes "Прямое скачивание файла ChefRecipeApp.apk с постоянной цифровой подписью" || true
